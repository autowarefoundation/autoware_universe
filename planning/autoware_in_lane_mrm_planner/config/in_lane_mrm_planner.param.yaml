/**:
  ros__parameters:
    # generate_parameter_library parameters
    planning_frequency_hz: 10.0

    path_planning:
      path_length:
        backward: 5.0
        forward: 300.0

      smooth_goal_connection:
        search_radius_range: 7.5
        pre_goal_offset: 1.0

      ego_nearest_lanelet:
        dist_threshold: 3.0
        yaw_threshold: 1.046

      path_shift:
        enable: true
        minimum_shift_length: 0.5
        minimum_shift_yaw: 0.349 # 20 deg
        minimum_shift_distance: 5.0
        min_speed_for_curvature: 2.77  # [m/s] 10 km/h
        lateral_accel_limit: 1.0      # [m/s^2]

      waypoint_group:
        separation_threshold: 1.0
        interval_margin_ratio: 10.0

      output:
        delta_arc_length: 0.5

    obstacle_stop:
      enable: true
      use_objects: true
      use_pointcloud: false
      stop_margin: 6.0
      nominal_stopping_decel: 1.0 # [m/s^2]
      maximum_stopping_decel: 4.0 # [m/s^2]
      stopping_jerk: 3.0 # [m/s^3]
      on_time_buffer: 0.3 # [s]
      off_time_buffer: 1.0 # [s]
      lateral_margin: 0.3     # lateral margin on top of ego width from trajectory to consider for obstacle stop [m]
      longitudinal_margin: 10.0 # longitudinal margin applied to each trajectory-point footprint [m]

      objects:
        object_types: ["car", "truck", "bus", "trailer", "motorcycle", "bicycle", "pedestrian", "unknown"] # object types to consider for obstacle stop
        max_velocity_th: 1.0     # maximum velocity threshold for target object [m/s]
        stopped_velocity_th: 0.25 # velocity threshold for target object to be considered as stopped [m/s]

      rss_params:
        enable: true
        object_decel:
          car: 1.2
          truck: 1.2
          bus: 1.2
          trailer: 1.2
          motorcycle: 3.0
          bicycle: 3.0
          pedestrian: 10.0
        ego_decel: 4.0           # [m/s^2]
        reaction_time: 0.2       # [s]
        safety_margin: 2.0       # [m]
        lookahead_horizon: 1.5   # [s]

      pointcloud:
        height_buffer: 0.5  # height buffer to add above ego height [m]
        min_height: 0.2  # minimum height of pointcloud [m]
        detection_range: 100.0 # detection range [m]
        voxel_grid_filter:
          x: 0.2
          y: 0.2
          z: 0.2
          min_size: 3
        clustering:
          tolerance: 0.5  #[m]
          min_height: 0.5
          min_size: 10
          max_size: 10000

    post_resample:
      max_trajectory_length: 300.0
      min_trajectory_length: 30.0
      resample_time: 10.0
      dense_resample_dt: 0.1
      dense_min_interval_distance: 0.1
      sparse_resample_dt: 0.1
      sparse_min_interval_distance: 1.0

    debug:
      enable_path: true
      enable_shifted_trajectory: true
      enable_optimizer_trajectory: true
      enable_modifier_trajectory: true
      enable_output_trajectory: true

    mrm_velocity:
      target_deceleration: -1.5
      target_jerk: -5.0
      max_jerk_relaxation: -10.0
      max_deceleration_relaxation: -3.0
      step_jerk_relaxation: -5.0
      step_deceleration_relaxation: -1.0
      decel_resample_range: 2.0
      decel_resample_interval: 0.1

    trajectory_validator:
      enable: true
      min_point_count: 3

    latch:
      use_latched_objects: true
