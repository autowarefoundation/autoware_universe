// gRPC wire contract between the scenario framework and
// autoware_carla_interface. The contract is intentionally tiny: the scenario
// framework hands Autoware the mission (initial pose + goal), and the Autoware
// side reports back a single readiness flag. The Autoware side owns the entire
// startup sequence.
//
// Delegation (all on the Autoware side, not the framework):
//   - localization init  : autoware_automatic_pose_initializer (GNSS) or a
//                          published /initialpose via initial_pose_adaptor.
//   - routing            : routing_adaptor, from the goal pose.
//   - engage + readiness : small Autoware-side helpers (an auto-engage node and
//                          a readiness aggregator that ANDs localization /
//                          routing / operation-mode state) - see the follow-up
//                          issues.
//
// This is DELIBERATELY SEPARATE from the alpasim egodriver contract
// (proto/alpasim_grpc/v0/egodriver.proto), which is a driving-policy interface.
// Autoware drives the ego itself through the ROS 2 interface node.
//
// Topology (splatsim-consistent): the SERVER is hosted by the scenario library
// and the autoware_carla_interface node is the CLIENT, matching splatsim, where
// the interface node runs a gRPC client (splatsim/grpc_client.py) against a
// server launched in Docker (splatsim/docker_manager.py). Here the interface
// node likewise launches the scenario-library container and then dials this
// AutowareBridge server. Keeping the interface node a client lets it reuse that
// existing splatsim client/Docker-launch scaffolding, and keeps the scenario
// library free of any ROS 2 dependency (all ROS 2 / Autoware AD API I/O lives on
// the client, inside the interface node).
//
// Because only the client initiates, the two RPCs are direction-inverted from a
// "framework pushes" contract: the client PULLS the mission (GetMission) and
// PUSHES its readiness (ReportReadiness). The framework holds the mission and
// latches the reported readiness so AutowareEgoEntity can poll it per tick.
//
// High-bandwidth data (sensors, control, /clock, tf) never flows here; it stays
// on ROS 2 topics and direct CARLA control inside the interface node. Ego
// pose/velocity for scenario conditions is read directly from the CARLA world.
//
// This file is the design-time contract only. Stub generation (via
// scripts/compile_protos.py) and the server/client implementations are
// follow-up work.

syntax = "proto3";

package autoware_carla_scenario.autoware_bridge.v0;

// Shared physics primitives. These deliberately mirror the splatsim proto
// (tier4/splatsim proto/splatsim/v1/rendering_service.proto) by name and shape
// so the two stacks can converge on a common set of physics types later.
message Vector3 {
  double x = 1;
  double y = 2;
  double z = 3;
}

message Quaternion {
  // wxyz convention (matching the splatsim / gsplat and alpasim common.Quat
  // convention). The interface node converts to/from ROS geometry_msgs
  // (xyzw) internally.
  double w = 1;
  double x = 2;
  double y = 3;
  double z = 4;
}

// A full 6-DoF map-frame pose (metres), structurally geometry_msgs/Pose - the
// representation Autoware and autoware_carla_interface hold natively, so no
// lossy conversion is needed at the boundary. position.z disambiguates
// multi-level roads (overpasses); the quaternion (not a bare yaw) represents
// pitch/roll on ramps and banked segments exactly.
message Pose {
  Vector3 position = 1;
  Quaternion rotation = 2;
}

// -- Request / response messages --------------------------------------------

message GetMissionRequest {}
message GetMissionResponse {
  // False until the scenario framework has a mission to hand out (i.e. the
  // AutowareEgoEntity has reached on_scenario_start). The client polls until
  // this is true, then reads initial_pose / goal.
  bool available = 1;
  Pose initial_pose = 2;  // where Autoware initializes localization
  Pose goal = 3;          // where Autoware plans the route to
}

message ReportReadinessRequest {
  // True once Autoware is initialized, routed, engaged, and driving.
  bool ready = 1;
}
message ReportReadinessResponse {}

// -- Service ----------------------------------------------------------------

// Hosted by the scenario library; the autoware_carla_interface node is the
// client (see the topology note above).
service AutowareBridge {
  // Fetch the scenario's mission (initial pose + goal). The client polls this
  // until `available`; the Autoware side then auto-initializes, routes, and
  // engages from it.
  rpc GetMission(GetMissionRequest) returns (GetMissionResponse);

  // Report the single readiness flag once Autoware is initialized, routed,
  // engaged, and driving. The framework latches it so the entity can poll it
  // per tick.
  rpc ReportReadiness(ReportReadinessRequest) returns (ReportReadinessResponse);
}
